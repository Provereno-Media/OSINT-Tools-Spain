name: Check README links

on:
  pull_request:
    paths:
      - README.md
  push:
    branches:
      - main
    paths:
      - README.md
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check links in README
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 10
            --timeout 60
            --accept '100..=103,200..=299,403,429'
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
            --exclude-all-private
            README.md
          format: markdown
          fail: true
          failIfEmpty: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
